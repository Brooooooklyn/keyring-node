name: CI
env:
  DEBUG: napi:*
  APP_NAME: keyring
  MACOSX_DEPLOYMENT_TARGET: '10.13'
'on':
  push:
    branches:
      - main
    tags-ignore:
      - '**'
    paths-ignore:
      - '**/*.md'
      - LICENSE
      - '**/*.gitignore'
      - .editorconfig
      - docs/**
  pull_request: null
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # PR runs cancel stale runs for fast iteration. Main pushes never cancel
  # each other: a later push must not kill an in-flight release — signing and
  # notarization can take many minutes — and skip its publish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install dependencies
        run: yarn install

      - name: ESLint
        run: yarn lint

      - name: Cargo fmt
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --locked

      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tool: cargo-about@0.9.2

      # npm/<platform>/LICENSE.third-party.md are generated from Cargo.lock and
      # shipped in the platform packages; fail if a Cargo.lock change left
      # them stale. Fix with `yarn licenses` and commit the result.
      - name: Check third-party license files
        run: |
          cargo fetch --locked
          yarn licenses --check
  build:
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: x86_64-apple-darwin
            build: yarn build --target x86_64-apple-darwin
          - host: windows-latest
            build: yarn build --target x86_64-pc-windows-msvc
            target: x86_64-pc-windows-msvc
          - host: windows-latest
            build: yarn build --target i686-pc-windows-msvc
            target: i686-pc-windows-msvc
          - host: ubuntu-24.04-arm
            target: x86_64-unknown-linux-gnu
            build: yarn build --target x86_64-unknown-linux-gnu --use-napi-cross
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            build: yarn build --target x86_64-unknown-linux-musl -x
          - host: macos-latest
            target: aarch64-apple-darwin
            build: yarn build --target aarch64-apple-darwin
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            build: yarn build --target aarch64-unknown-linux-gnu --use-napi-cross
          - host: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            build: yarn build --target armv7-unknown-linux-gnueabihf --use-napi-cross
          - host: ubuntu-latest
            target: aarch64-unknown-linux-musl
            build: yarn build --target aarch64-unknown-linux-musl -x
          - host: windows-latest
            target: aarch64-pc-windows-msvc
            build: yarn build --target aarch64-pc-windows-msvc
          - host: ubuntu-latest
            target: riscv64gc-unknown-linux-gnu
            setup: |
              sudo apt-get update
              sudo apt-get install gcc-riscv64-linux-gnu -y
            build: yarn build --platform --target riscv64gc-unknown-linux-gnu
    name: stable - ${{ matrix.settings.target }} - node@22
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - name: Install
        uses: dtolnay/rust-toolchain@stable
        if: ${{ !matrix.settings.docker }}
        with:
          toolchain: stable
          targets: ${{ matrix.settings.target }}
      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.napi-rs
            .cargo-cache
            target/
          key: ${{ matrix.settings.target }}-cargo-${{ matrix.settings.host }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ matrix.settings.target }}-cargo-${{ matrix.settings.host }}-
      - uses: goto-bus-stop/setup-zig@v2
        if: ${{ contains(matrix.settings.target, 'musl') }}
        with:
          version: 0.15.1
      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        if: ${{ contains(matrix.settings.target, 'musl') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tool: cargo-zigbuild
      - name: Install cargo-auditable
        uses: taiki-e/install-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tool: cargo-auditable@0.7.7,rust-audit-info
      - name: Setup toolchain
        run: ${{ matrix.settings.setup }}
        if: ${{ matrix.settings.setup }}
        shell: bash
      - name: Setup node x86
        if: matrix.settings.target == 'i686-pc-windows-msvc'
        run: yarn config set supportedArchitectures.cpu "ia32"
        shell: bash
      - name: Install dependencies
        run: yarn install
      - name: Setup node x86
        uses: actions/setup-node@v7
        if: matrix.settings.target == 'i686-pc-windows-msvc'
        with:
          node-version: 22
          architecture: x86
      # --locked builds exactly the committed Cargo.lock, and cargo-auditable
      # embeds that dependency list into the .node binary (`.dep-v0` section),
      # readable with `cargo audit bin`, `rust-audit-info`, syft, trivy, etc.
      #
      # `napi build` spawns `cargo` directly, so `cargo auditable build` is
      # wired in through the same two variables it sets itself. This works on
      # every host, including Windows, where a `CARGO` wrapper script cannot
      # be spawned. The next step fails the build if the data goes missing.
      - name: Build
        run: ${{ matrix.settings.build }} -- --locked
        shell: bash
        env:
          RUSTC_WORKSPACE_WRAPPER: cargo-auditable
          CARGO_AUDITABLE_ORIG_ARGS: '{"offline":false,"locked":true,"frozen":false,"config":[]}'
      - name: Verify embedded dependency list
        run: rust-audit-info ${{ env.APP_NAME }}.*.node > /dev/null
        shell: bash
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.settings.target }}
          path: ${{ env.APP_NAME }}.*.node
          if-no-files-found: error
  build-freebsd:
    runs-on: ubuntu-latest
    name: Build FreeBSD
    steps:
      - uses: actions/checkout@v7
      - name: Build
        id: build
        uses: cross-platform-actions/action@v1.6.0
        env:
          DEBUG: napi:*
          RUSTUP_IO_THREADS: 1
        with:
          operating_system: freebsd
          version: '15.0'
          memory: 8G
          cpu_count: 3
          environment_variables: 'DEBUG RUSTUP_IO_THREADS'
          shell: bash
          run: |
            sudo pkg install -y -f curl www/node www/npm libnghttp2 cmake dbus pkgconf
            sudo npm install --location=global --ignore-scripts yarn
            curl https://sh.rustup.rs -sSf --output rustup.sh
            sh rustup.sh -y --profile minimal --default-toolchain beta
            source "$HOME/.cargo/env"
            echo "~~~~ rustc --version ~~~~"
            rustc --version
            echo "~~~~ node -v ~~~~"
            node -v
            echo "~~~~ yarn --version ~~~~"
            yarn --version
            pwd
            ls -lah
            whoami
            env
            freebsd-version
            cargo install --locked cargo-auditable@0.7.7 rust-audit-info
            yarn install
            RUSTC_WORKSPACE_WRAPPER=cargo-auditable \
              CARGO_AUDITABLE_ORIG_ARGS='{"offline":false,"locked":true,"frozen":false,"config":[]}' \
              yarn build -- --locked
            rust-audit-info keyring.*.node > /dev/null || { echo "no cargo-auditable data in the FreeBSD binary"; exit 1; }
            rm -rf node_modules
            rm -rf target
            rm -rf .yarn/cache
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bindings-freebsd
          path: ${{ env.APP_NAME }}.*.node
          if-no-files-found: error
  # Signing lives in its own job, never in the build matrix: the build legs
  # run yarn/cargo (arbitrary dependency code), and reusable Apple credentials
  # must not exist on a runner that has executed it. This job checks out
  # nothing and runs no package scripts — it only downloads the immutable
  # build artifacts, signs, notarizes, and re-uploads them.
  #
  # The job never runs for PRs, so PR-triggered jobs (forked or not) can never
  # read the Apple secrets. On main pushes it is a cheap no-op unless the
  # commit publishes to npm (same predicate as the publish job below), so the
  # credentials only materialize for actual releases.
  sign-macos:
    name: Sign and notarize macOS binaries
    runs-on: macos-latest
    needs:
      - build
    if: github.event_name != 'pull_request'
    steps:
      - name: Check whether this commit publishes to npm
        id: release
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          # Subject line only, full match with optional prerelease suffix:
          # covers `x.y.z` (npm publish) and `x.y.z-...` (npm publish
          # --tag next), mirroring the publish job. Scanning the whole commit
          # body would let release-note text like "9.0.4." inside an
          # unrelated commit authorize certificate use — every historical
          # release commit here has a bare-version subject.
          if printf '%s\n' "$COMMIT_MSG" | head -n1 | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "match=true" >> "$GITHUB_OUTPUT"
          else
            echo "match=false" >> "$GITHUB_OUTPUT"
            echo "Not a release commit; skipping signing."
          fi
      - name: Download macOS artifacts
        if: steps.release.outputs.match == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: bindings-*-apple-darwin
          path: .
          merge-multiple: true
      - name: Import signing certificate
        if: steps.release.outputs.match == 'true'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP/cert.p12"' EXIT TERM INT
          # Ephemeral per-job keychain: the default login keychain is locked on
          # runners, and its GUI unlock prompt can never be answered in CI.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$CSC_LINK" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          # -x: the private key stays non-extractable after import.
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -x \
            -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          # Without this, codesign blocks on a GUI keychain-access prompt that
          # can never be answered, and the job hangs until it times out.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)"
          [ -n "$IDENTITY" ] || { echo "::error::no Developer ID Application identity in the keychain"; exit 1; }
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
      - name: Sign and verify .node binaries
        if: steps.release.outputs.match == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for BIN in keyring.darwin-*.node; do
            # The notary service rejects signatures without the hardened
            # runtime (--options runtime) or without a secure Apple timestamp.
            codesign --sign "$SIGN_IDENTITY" --options runtime --timestamp --force "$BIN"
            # A wrong or malformed signature is cheapest to catch here; the
            # notary is the slowest way possible to discover one.
            codesign --verify --strict --verbose=2 "$BIN"
            codesign -dvvv "$BIN" > "$RUNNER_TEMP/codesign-info.txt" 2>&1
            grep -q "Authority=Developer ID Application" "$RUNNER_TEMP/codesign-info.txt" \
              || { echo "::error::$BIN signed with the wrong certificate"; cat "$RUNNER_TEMP/codesign-info.txt"; exit 1; }
            grep -q "TeamIdentifier=$APPLE_TEAM_ID" "$RUNNER_TEMP/codesign-info.txt" \
              || { echo "::error::$BIN has an unexpected TeamIdentifier"; cat "$RUNNER_TEMP/codesign-info.txt"; exit 1; }
            grep -q "^Timestamp=" "$RUNNER_TEMP/codesign-info.txt" \
              || { echo "::error::$BIN is missing a secure timestamp"; cat "$RUNNER_TEMP/codesign-info.txt"; exit 1; }
          done
      # Notarization authenticates with the App Store Connect API key, so the
      # certificate is disposable once signing is done. Destroy the keychain
      # before the long notary wait instead of leaving it unlocked.
      - name: Destroy signing keychain
        if: steps.release.outputs.match == 'true'
        run: security delete-keychain "$KEYCHAIN"
      - name: Notarize .node binaries
        if: steps.release.outputs.match == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/AuthKey.p8"
          trap 'rm -f "$KEY" "$RUNNER_TEMP/upload.zip" "$RUNNER_TEMP/notary.json"' EXIT TERM INT
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$KEY"
          chmod 600 "$KEY"
          # A malformed key surfaces inside notarytool as an authentication
          # error and sends you looking at the wrong secret; fail early instead.
          head -1 "$KEY" | grep -q 'BEGIN PRIVATE KEY' \
            || { echo "::error::APPLE_API_KEY_P8 did not decode to a PEM private key"; exit 1; }
          for BIN in keyring.darwin-*.node; do
            ditto -c -k --keepParent "$BIN" "$RUNNER_TEMP/upload.zip"
            xcrun notarytool submit "$RUNNER_TEMP/upload.zip" \
              --key "$KEY" --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER_ID" --wait --timeout 45m \
              --output-format json | tee "$RUNNER_TEMP/notary.json"
            SUBMISSION_ID="$(jq -r '.id' "$RUNNER_TEMP/notary.json")"
            STATUS="$(jq -r '.status' "$RUNNER_TEMP/notary.json")"
            if [ "$STATUS" != "Accepted" ]; then
              echo "::error::notarization of $BIN ended with status: $STATUS"
              xcrun notarytool log "$SUBMISSION_ID" \
                --key "$KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID" || true
              exit 1
            fi
            # A bare .node cannot hold a stapled ticket, so Gatekeeper must
            # find it online. spctl must run FIRST: it performs the online
            # ticket lookup and caches the assessment, and codesign's
            # `notarized` requirement only consults that local cache — on a
            # fresh machine it fails even for a ticket issued long ago.
            GATE_OK=""
            for attempt in 1 2 3 4; do
              if spctl -a -t open --context context:primary-signature -vvv "$BIN" 2>&1 \
                   | grep -q 'source=Notarized Developer ID' \
                && codesign -v -R='notarized' "$BIN"; then
                GATE_OK=1
                break
              fi
              echo "notarization gate attempt $attempt for $BIN failed; retrying in 20s"
              sleep 20
            done
            [ -n "$GATE_OK" ] \
              || { echo "::error::Gatekeeper still rejects the notarized $BIN"; exit 1; }
          done
      # overwrite replaces each artifact in place (delete-then-upload), which
      # keeps the fixed names that test and publish consume. Both binaries
      # reach this point only after every signature and notarization gate has
      # passed; if an upload ever failed mid-job the originals would be gone
      # and recovery would mean re-running the whole workflow.
      - name: Upload signed aarch64 artifact
        if: steps.release.outputs.match == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: bindings-aarch64-apple-darwin
          path: keyring.darwin-arm64.node
          if-no-files-found: error
          overwrite: true
      - name: Upload signed x86_64 artifact
        if: steps.release.outputs.match == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: bindings-x86_64-apple-darwin
          path: keyring.darwin-x64.node
          if-no-files-found: error
          overwrite: true
      # Belt-and-braces cleanup for every failure path above: remove the
      # keychain and any credential files no matter how the job ended.
      - name: Clean up credentials
        if: always() && steps.release.outputs.match == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/AuthKey.p8" \
                "$RUNNER_TEMP/upload.zip" "$RUNNER_TEMP/notary.json" \
                "$RUNNER_TEMP/codesign-info.txt"
  test:
    name: Test bindings on ${{ matrix.settings.host }} - node@${{ matrix.node }}
    needs:
      - build
      # macOS legs must test the signed binaries on release runs. A skipped
      # sign-macos (PRs, non-release pushes) must not skip the tests, but a
      # failed one must block them — and with it the publish job.
      - sign-macos
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
        settings:
          - host: macos-latest
            target: 'aarch64-apple-darwin'
          - host: windows-latest
            target: 'x86_64-pc-windows-msvc'
          - host: ubuntu-latest
            target: 'x86_64-unknown-linux-gnu'
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: yarn
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: bindings-${{ matrix.settings.target }}
          path: .
      - name: List packages
        run: ls -R .
        shell: bash
      - name: Install dependencies
        run: yarn install
      - name: Install system components
        if: matrix.settings.host == 'ubuntu-latest'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gnome-keyring dbus dbus-x11
      - name: Test bindings
        if: matrix.settings.host == 'ubuntu-latest'
        run: |
          dbus-run-session -- bash -c "rm -f $HOME/.local/share/keyrings/* && echo -n "test" | gnome-keyring-daemon --unlock && yarn test"
      - name: Test bindings
        if: matrix.settings.host != 'ubuntu-latest'
        run: yarn test

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
      - build-freebsd
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - name: Install dependencies
        run: yarn install
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Create npm dirs
        run: yarn napi create-npm-dirs
      - name: Move artifacts
        run: yarn artifacts
      - name: List packages
        run: ls -R ./npm
        shell: bash
      - name: Publish
        run: |
          npm install -g npm
          if git log -1 --pretty=%B | grep "^[0-9]\+\.[0-9]\+\.[0-9]\+$";
          then
            npm publish --access public
          elif git log -1 --pretty=%B | grep "^[0-9]\+\.[0-9]\+\.[0-9]\+";
          then
            npm publish --tag next --access public
          else
            echo "Not a release, skipping publish"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
